    definition_stabilized, evidence_balance_improved, probability_calibrated,
    causal_model_improved, value_tradeoff_clarified, memory_uncertainty_mapped,
    user_generated_insight, user_agency_preserved, rapport_preserved,
    productive_aporia, coercion_risk, shame_risk, reactance_increase,
    misdiagnosis_risk, manipulation_risk, premature_closure,
