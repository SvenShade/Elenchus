mcts:
  simulations: 12
  max_rollout_depth: 2
  c_puct: 1.5
  root_action_selection: visits
  random_seed: 11
  trace: true
  progressive_widening:
    enabled: true
    k: 3.0
    alpha: 0.5
    initial_children: 4
    expand_batch: 1
    max_candidates: 40
    candidate_refresh_visits: [0, 5, 20, 60]

initial_state:
  task: >
    Help the user examine their beliefs, motives, conflicts, and cognitive
    biases through sharp but ethical dialectic inquiry. Challenge evasion and
    inconsistency while preserving autonomy. This is not therapy, diagnosis,
    treatment, or crisis counseling.
  transcript: []
