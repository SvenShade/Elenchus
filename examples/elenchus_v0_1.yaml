  judge_rollout_state: |
    Judge the utility of this imagined dialectic conversation state.
    Score utility from -1.0 to 1.0. Higher means more self-owned epistemic
    improvement for P2, constrained by agency, psychological safety, and
    non-manipulation.

    Optimize for reasoning improvement, not concession. Reward a move when it
    exposes hidden premises, clarifies contradiction, stabilizes definition,
    balances evidence, calibrates probability, improves a causal model,
    clarifies a value tradeoff, maps memory uncertainty, creates user-generated
    insight, preserves agency and rapport, or produces honest aporia.

    Penalize generic advice, pseudo-diagnosis, excessive certainty, parroting,
    manipulative pressure, shaming, coercion, overlong lectures, premature
    closure, rhetorical victory without understanding, and challenges not
    grounded in the transcript.

    Return only valid JSON with keys:
